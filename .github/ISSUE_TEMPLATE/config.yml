blank_issues_enabled: false
contact_links:
    - name: Report a security vulnerability (private)
      url: https://github.com/HeroicLands/package-build/security/advisories/new
      about: Exploitable weaknesses must be reported privately as a security advisory — never as a public issue. See the Security Policy and issue-reporting §7.
    - name: A content note that is wrong on only one tree
      url: https://github.com/HeroicLands/package-build/blob/main/.github/ISSUE_REPORTING.md#7-which-repository-does-an-issue-belong-in
      about: If one package compiles wrong and the others do not, the fault is usually that package's note or config, not the toolchain. Check §7 before filing here.
    - name: An issue with the SoHL system itself
      url: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/issues/new/choose
      about: This tracker is for the shared build toolchain. System code, sheets, and rules automation are tracked in the system repository.
    - name: Question or discussion
      url: https://bit.ly/44vZ10j
      about: For questions and general discussion, use the SoHL Discord.
