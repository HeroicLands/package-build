# Dependabot version updates.
#
# This repository is the toolchain every HeroicLands package builds with, and
# it is published to npm — so its own dependency tree reaches every consumer's
# build and everyone who installs it. Nothing here inherits a consumer's
# config: this repository produces `@heroiclands/*`, it doesn't depend on it,
# so the single-package-group reasoning a consumer's dependabot.yml carries
# for that scope does not apply.
#
# No `labels:` is set. There is no closed label registry here (no
# `.github/labels.yml`, no labels-sync workflow), so nothing would prune an
# unmanaged label the way it does in the consumer repositories — Dependabot's
# own default `dependencies` label is fine as-is.
#
# `@foundryvtt/foundryvtt-cli` and `classic-level` are each their own
# ungrouped single-package entry, ordered ahead of the housekeeping catch-all,
# for every update type including minor and patch. Both sit directly on the
# compendium pack pipeline — `engine/compendiums.mjs` and
# `engine/scene-levels.mjs` read and write LevelDB packs through them — and a
# version bump that silently changes how a pack compiles is exactly the
# failure this repository's byte-level output comparisons exist to catch. A
# grouped housekeeping pull request would hide which dependency caused a
# regression; an isolated one puts it in the diff.
#
# One `ignore` entry, added the day it was needed (#100 left the slot open for
# exactly this). `typescript` majors are held at 6 because TypeScript 7 removes
# the JavaScript compiler API this package parses with — see the entry's own
# comment below for the evidence.
#
# The prediction that stood here before it is worth keeping, because it was
# wrong in an instructive way. It said `build.yml`'s "Declaration emit" step
# already gates a breaking `typescript` bump, so no ceiling was needed. That
# step passes clean under 7.0.2: `tsc` still emits every `.d.mts` file. The
# break is in `coverage.mjs`, which uses `typescript` as a *parser* rather than
# as a compiler, and it was `npm test` that caught it — 11 failures in
# `tests/coverage.test.ts`. A dependency can be load-bearing in two unrelated
# ways at once, and naming only one of them names the wrong gate.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      commit-message:
          prefix: chore(deps)
          prefix-development: chore(deps-dev)
      ignore:
          # TypeScript 7 is the native port, and its npm package no longer
          # exposes the JavaScript compiler API. `typescript`'s "." export
          # resolves to `lib/version.cjs`, whose entire surface is `version` and
          # `versionMajorMinor`.
          #
          # `coverage.mjs` uses that API as a *parser* — it reads localization
          # keys out of a consumer's `src/**/*.{ts,mjs}` by walking a real AST,
          # deliberately down one path so JavaScript and TypeScript cannot
          # drift. Under 7.0.2 the AST *vocabulary* survives behind
          # `typescript/unstable/ast` (`ScriptTarget`, and every `isX` guard the
          # scan uses), but the three things that drive it exist nowhere in the
          # JS surface: `createSourceFile`, `forEachChild` and
          # `flattenDiagnosticMessageText`. The only `createSourceFile` in 7 is a
          # factory that assembles a SourceFile from statements already parsed,
          # not a parser.
          #
          # Parsing now lives in the Go binary, reachable only through
          # `unstable/sync`'s Project/Program API. Adopting it would put a
          # subprocess and a virtual filesystem inside a module whose stated
          # contract is "everything here is pure — source text in, references or
          # findings out", in exchange for an explicitly unstable API. That is a
          # deliberate migration, not a dependency bump.
          #
          # Minor and patch updates within 6 still arrive. Lift this the day
          # TypeScript publishes a stable in-process parse entry point, or the
          # day `coverage.mjs` no longer needs one.
          - dependency-name: typescript
            update-types:
                - version-update:semver-major
      groups:
          # The pack pipeline first: each is its own decision and neither may be
          # swept into a grouped housekeeping pull request, for any update type.
          # Dependabot assigns a dependency to the first group it matches, so the
          # order of these entries is what does the work.
          foundryvtt-cli:
              patterns:
                  - "@foundryvtt/foundryvtt-cli"
          classic-level:
              patterns:
                  - classic-level
          production-minor-patch:
              dependency-type: production
              update-types:
                  - minor
                  - patch
          development-minor-patch:
              dependency-type: development
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          github-actions:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch
