# Dependabot version updates.
#
# This repository is the toolchain every HeroicLands package builds with, and
# it is published to npm — so its own dependency tree reaches every consumer's
# build and everyone who installs it. Nothing here inherits a consumer's
# config: this repository produces `@heroiclands/*`, it doesn't depend on it,
# so the single-package-group reasoning a consumer's dependabot.yml carries
# for that scope does not apply.
#
# No `labels:` is set. There is no closed label registry here (no
# `.github/labels.yml`, no labels-sync workflow), so nothing would prune an
# unmanaged label the way it does in the consumer repositories — Dependabot's
# own default `dependencies` label is fine as-is.
#
# `@foundryvtt/foundryvtt-cli` and `classic-level` are each their own
# ungrouped single-package entry, ordered ahead of the housekeeping catch-all,
# for every update type including minor and patch. Both sit directly on the
# compendium pack pipeline — `engine/compendiums.mjs` and
# `engine/scene-levels.mjs` read and write LevelDB packs through them — and a
# version bump that silently changes how a pack compiles is exactly the
# failure this repository's byte-level output comparisons exist to catch. A
# grouped housekeeping pull request would hide which dependency caused a
# regression; an isolated one puts it in the diff.
#
# No `ignore` entries. `typescript` is a direct dependency here (`tsc` emits
# the published `.d.mts` files), but nothing peers against a ceiling the way
# SoHL's TypeDoc/typescript-eslint do, and `build.yml`'s "Declaration emit"
# step already gates a breaking bump on every pull request — so there is no
# known-bad range to record. Add one, with its reason, the day this repository
# gains a dependency that needs it (#100).
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      commit-message:
          prefix: chore(deps)
          prefix-development: chore(deps-dev)
      groups:
          # The pack pipeline first: each is its own decision and neither may be
          # swept into a grouped housekeeping pull request, for any update type.
          # Dependabot assigns a dependency to the first group it matches, so the
          # order of these entries is what does the work.
          foundryvtt-cli:
              patterns:
                  - "@foundryvtt/foundryvtt-cli"
          classic-level:
              patterns:
                  - classic-level
          production-minor-patch:
              dependency-type: production
              update-types:
                  - minor
                  - patch
          development-minor-patch:
              dependency-type: development
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          github-actions:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch
