name: Publish to npm

# The whole release process, from a merged pull request to a version on the
# registry. Nothing here is started by hand.
#
#   1. A pull request declares its bump as a `.changeset/*.md` file (CI fails it
#      otherwise — see the "Changeset declared" job in build.yml).
#   2. Merging it to `main` runs this workflow, which opens or updates the
#      **Version Packages** pull request: the version bump plus the rewritten
#      CHANGELOG.md. An unreleased state is therefore a pull request sitting in
#      the queue, not an absence nobody can see (#4).
#   3. Merging *that* runs this workflow again with no changesets left, so it
#      falls through to `changeset publish`: npm publish, the `v<version>` tag,
#      and the GitHub Release with the changelog section as its body.
#
# The file name is load-bearing. npm Trusted Publishing binds the publisher to
# this repository *and this workflow path*, so renaming the file revokes the
# credential until the trusted publisher is reconfigured on npm.
on:
    push:
        branches: [main]
    # Manual recovery: re-runs the publish for a version that is merged and
    # versioned but not on the registry. `changeset publish` is idempotent, so
    # running it against an already-published version is a no-op.
    workflow_dispatch:

permissions:
    # contents: write      -> push the version branch, create the tag and Release
    # pull-requests: write -> open and update the Version Packages pull request
    # id-token: write      -> npm Trusted Publishing (OIDC). There is no NPM_TOKEN.
    contents: write
    pull-requests: write
    id-token: write
    statuses: write

# Two pushes to main must never race on the version pull request or the tag.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Version and publish @heroiclands/package-build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - run: npm ci

            # Guard the release path with the same checks `main` gets, so a red
            # commit cannot reach the registry. These run before the publish
            # step, not after it — a package that fails here is never published.
            - run: npm test
            - run: npm run build:types

            # OIDC Trusted Publishing needs npm >= 11.5; the runner ships older.
            # `changeset publish` shells out to this npm, so it must be upgraded
            # before the action runs, not inside it.
            - name: Upgrade npm for OIDC
              run: npm install -g npm@latest

            # With changesets pending: opens or updates the Version Packages PR
            # and stops. With none pending — the state right after that PR
            # merges — runs `changeset publish`, which publishes every package
            # whose version is not yet on the registry, tags it, and (because
            # `publish` is set) creates the GitHub Release from its CHANGELOG.md
            # section. Both halves are no-ops when there is nothing to do, so an
            # ordinary push to `main` releases nothing.
            - name: Version, or publish
              id: changesets
              uses: changesets/action@v2
              with:
                  # `changeset version` rewrites package.json and the
                  # CHANGELOG but never the lockfile, so its root `version`
                  # kept the previous release's number every time — this
                  # repository and content-build were each one release behind.
                  # Refreshing it here keeps the two in step by construction
                  # rather than by someone noticing.
                  #
                  # It must be ONE command, not a `&&` chain. This input is
                  # tokenized and exec'd by both v1 and v2, never handed to a
                  # shell, so a chain
                  # is read as arguments to the first command: `changeset`
                  # receives `--package-lock-only` and cac rejects it as an
                  # unknown `packageLockOnly` option. content-build shipped the
                  # identical chain and **every release after it failed** —
                  # three merged pull requests published nothing — while
                  # looking fine, because the step is skipped entirely when the
                  # only pending changesets are empty. An npm script is the
                  # seam that does get a shell.
                  version-script: npm run changeset:version
                  publish-script: npx changeset publish
                  commit-message: "chore(release): version packages"
                  pr-title: "chore(release): version packages"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # The Version Packages pull request is opened by GITHUB_TOKEN, and
            # GitHub deliberately does not start workflow runs from that token —
            # so the `pull_request` checks never run on it and a required check
            # would leave it unmergeable forever. Report the one required
            # context here instead. It is not a rubber stamp: that pull request
            # *is* the declared bump, consuming the changesets the gate exists
            # to require.
            #
            # The output is `pr-number`. v2 renamed it from v1's
            # `pullRequestNumber`, and an unset output reads as the empty
            # string rather than erroring — so the v1 spelling made this
            # condition `'' != ''` and left the step permanently skipped
            # instead of failing loudly.
            #
            # Bracket notation, not `outputs.pr-number`: a hyphen is the
            # subtraction operator in an Actions expression, so the dotted form
            # parses as `outputs.pr - number` and does not mean what it reads
            # as. `published` below stays dotted deliberately — it is the one
            # output name v2 kept unchanged, so a blanket kebab-case sweep of
            # this file would break the step that currently works.
            - name: Mark the version pull request as having declared its bump
              if: steps.changesets.outputs['pr-number'] != ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  SHA=$(gh api "repos/${{ github.repository }}/pulls/${{ steps.changesets.outputs['pr-number'] }}" --jq .head.sha)
                  gh api --method POST "repos/${{ github.repository }}/statuses/$SHA" \
                      -f state=success \
                      -f context='Changeset declared' \
                      -f description='This pull request is the bump; it consumes the changesets.'

            # Report what reached the registry. `npm view <pkg> version` lags a
            # successful publish by up to a minute or so, which reads as a
            # failed release to anyone checking; `dist-tags` is correct
            # immediately.
            - name: Confirm the published version
              if: steps.changesets.outputs.published == 'true'
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "Published @heroiclands/package-build@$VERSION"
                  npm view @heroiclands/package-build dist-tags --json
                  echo "Note: 'npm view @heroiclands/package-build version' may report the"
                  echo "previous version for up to a minute. dist-tags above is authoritative."
