name: Publish to npm

# The only GitHub workflow. GitHub mirrors Gitea, so a `v<version>` tag pushed
# on Gitea arrives here; this workflow publishes that version to npm and cuts
# its GitHub Release. Every check runs on Gitea before the tag exists.
#
# The file name is load-bearing. npm Trusted Publishing binds the publisher to
# the repository `HeroicLands/package-build` and the workflow file
# `release.yml`, with no environment. There is no NPM_TOKEN.
on:
    push:
        tags: ["v*"]

permissions:
    # contents: write -> create the GitHub Release
    # id-token: write -> npm Trusted Publishing (OIDC)
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
                  cache: npm
                  registry-url: https://registry.npmjs.org

            # `prepack` builds `types/`, which needs the dependencies.
            - run: npm ci

            # `prepack` builds the Info manual, which needs `makeinfo` and
            # `install-info` from Texinfo 7.0 or later; `install-info` is a separate
            # package, and the runner image must provide version 7.0 or later.
            - name: Texinfo, for the Info manual
              run: |
                  set -euo pipefail
                  if ! command -v makeinfo >/dev/null 2>&1 || ! command -v install-info >/dev/null 2>&1; then
                      if command -v sudo >/dev/null 2>&1; then
                          sudo apt-get update -q && sudo apt-get install -y -q texinfo install-info
                      else
                          apt-get update -q && apt-get install -y -q texinfo install-info
                      fi
                  fi
                  makeinfo --version | head -n 1
                  install-info --version | head -n 1

            - run: npm publish --provenance

            - name: Create the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  awk '/^## /{c++; if (c>=2) exit; next} c==1{print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
                  gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
