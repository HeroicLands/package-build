name: Build and Test

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

# A second push to the same branch supersedes the first; nothing here needs the
# older run to finish.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test-build:
        name: Build & Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # Wants a checkout and nothing else, so it runs before the install
            # and fails in seconds rather than after one. The rule — deferred
            # work is an issue, not a marker in a comment — and its
            # implementation live in the org-wide action; this repository
            # states only which files it applies to.
            #
            # `paths: .` rather than a list of directories: this package's
            # modules sit at its root as well as under `bin/`, `ci/`, `engine/`,
            # `hm3/` and `sohl/`, so a list would have to name sixteen root
            # files and would silently stop covering the seventeenth. A
            # checkout holds only tracked files, and the action prunes
            # `node_modules/`, so scanning the tree is both exact and
            # self-extending.
            - name: Check for forbidden markers
              uses: HeroicLands/.github/actions/todos@main
              with:
                  paths: .
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci

            # TEMPORARY DIAGNOSTIC for #381 — remove before this PR merges.
            #
            # The release workflow fails at `changeset version` with `sh: 1:
            # changeset: not found`, while `npm test` reaches `vitest` by bare
            # name in the same job. A clean `npm ci` from `main` links
            # `node_modules/.bin/changeset` locally and `npm run` finds it, so
            # the question this answers is which of those two is untrue on a
            # runner. Every line is read-only.
            - name: Diagnose changeset resolution
              run: |
                  echo "--- npm and node ---"
                  npm --version; node --version
                  echo "--- is the package installed? ---"
                  ls -l node_modules/@changesets/cli/bin.js || echo "MISSING: package file"
                  echo "--- is the bin linked? ---"
                  ls -l node_modules/.bin/changeset || echo "MISSING: .bin/changeset"
                  echo "--- for contrast, the one that works ---"
                  ls -l node_modules/.bin/vitest || echo "MISSING: .bin/vitest"
                  echo "--- does require.resolve find it? (the action's own method) ---"
                  node -e "console.log(require.resolve('@changesets/cli/bin.js', { paths: [process.cwd()] }))" || echo "FAILED: require.resolve"
                  echo "--- what PATH does an npm run-script actually get? ---"
                  # `env` is npm's own built-in script, so this needs no
                  # temporary entry in package.json.
                  npm run --silent env | tr ':' '\n' | grep -n "node_modules/.bin" || echo "node_modules/.bin is NOT on the run-script PATH"
                  echo "--- does a bare changeset resolve inside a run-script? ---"
                  npm run changeset -- --version || echo "FAILED: bare changeset via npm run"

            - name: Formatting
              run: npm run format:check
            # Separate steps rather than folded into `npm run lint`, which
            # chains them with `&&`: a formatting failure would short-circuit
            # the chain and hide every finding behind it. As separate steps the
            # failing one is named in the checks UI. `npm run lint` exists for
            # running them all locally in one command.
            #
            # This repository *provides* `content-build markdown`, and until now
            # was the one repository that never ran it (#92).
            - name: Markdown
              run: npm run lint:markdown
            # Every `system.*` target docs/content-format.md names, against a
            # published schema.json (#130). Run against a committed fixture
            # rather than a real system's artifact: this package ships no
            # system, and SoHL's own schema has three gaps already tracked as
            # Song-of-Heroic-Lands-FoundryVTT#1780, #1781 and #1782 — pointing
            # CI at it would fail this build for a reason that is not this
            # repository's. The fixture says so at the top of the file.
            - name: Content format
              run: npm run lint:content-format
            - name: Tests
              run: npm test
            # Declaration emit is what `prepack` runs at publish time, so a
            # failure here would otherwise only surface during a release.
            - name: Declaration emit
              run: npm run build:types

    # Every pull request declares the release it intends — a bump, or an empty
    # changeset saying it needs none. This is the gate that keeps a version from
    # being merged and then forgotten: the release pipeline versions from
    # changesets, so a change that adds none ships nothing.
    #
    # This job's name is the required status context — and, since it is the only
    # required one, a pull request it fails cannot be merged at all. So it has to
    # *report* on every pull request, including the two that legitimately carry
    # no changeset: the Version Packages one, which consumes them, and
    # Dependabot's, which bumps a `devDependency` no consumer installs. The check
    # step is skipped for those and the job still succeeds, rather than the job
    # being skipped, because a skipped job reports a skipped check and a required
    # context wants a passing one.
    #
    # It was previously left to not run at all there, on the assumption that a
    # branch pushed with GITHUB_TOKEN starts no workflow runs. That assumption
    # did not hold — build.yml ran on #43 and failed it — and a gate whose
    # correctness depends on a workflow *not* triggering is one bad assumption
    # away from blocking every release.
    changeset:
        name: Changeset declared
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # `changeset status --since` compares against a ref, so `main` has
            # to exist locally: a pull-request checkout is a detached merge
            # commit with no branches.
            - name: Fetch main
              run: git fetch --no-tags origin main:refs/remotes/origin/main
            # Two pull requests legitimately declare no release, and each is
            # recognised by what it *is* rather than by what it contains:
            #
            #   - `changeset-release/*` — the branch the changesets action opens
            #     the Version Packages pull request from. It consumes changesets;
            #     requiring it to add one would be circular.
            #   - Dependabot's — a dependency bump has no changelog line to
            #     write. Every dependency here is a `devDependency`, so it
            #     reaches no consumer: nothing about the published package
            #     changes, and an entry saying so would be noise in a file that
            #     describes the setting rather than the work.
            #
            # Dependabot is matched on the pull request's **author**, not on its
            # branch name. The branch prefix (`dependabot/…`) is the obvious
            # alternative and is what the `changeset-release/` case uses, but a
            # branch name is anybody's to choose, while the author is GitHub's
            # to set — and unlike `github.actor` it does not change to a human
            # when one reopens the pull request or pushes a fixup to it.
            - name: Changeset present
              if: >-
                  ${{ !startsWith(github.head_ref, 'changeset-release/')
                  && github.event.pull_request.user.login != 'dependabot[bot]' }}
              run: npx changeset status --since=origin/main
            - name: This pull request is the bump
              if: ${{ startsWith(github.head_ref, 'changeset-release/') }}
              run: >-
                  echo 'Version Packages pull request: it consumes the
                  changesets rather than declaring one.'
            - name: This pull request is a dependency bump
              if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
              run: >-
                  echo 'Dependabot pull request: a devDependency bump reaches no
                  consumer, so it declares no release.'
