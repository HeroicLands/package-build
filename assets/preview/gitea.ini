[markup.markdown]
ENABLED = true
FILE_EXTENSIONS = .md,.markdown,.mdown,.mkd
RENDER_COMMAND = /opt/heroiclands/node_modules/.bin/package-build-preview
IS_INPUT_FILE = false
NEED_POST_PROCESS = false
RENDER_CONTENT_MODE = sanitized

[markup.sanitizer.markdown.previewDiv]
ELEMENT = div
ALLOW_ATTR = class
REGEXP = ^(hl-preview(?:-[a-z-]+)?|alert(?:-(?:note|tip|important|warning))?|content-figure(?:-[a-z-]+)?|poetry)( (hl-preview(?:-[a-z-]+)?|alert(?:-(?:note|tip|important|warning))?|content-figure(?:-[a-z-]+)?|poetry))*$

[markup.sanitizer.markdown.previewSpan]
ELEMENT = span
ALLOW_ATTR = class
REGEXP = ^(hl-preview-[a-z-]+|alert-(?:title|icon)|poetry-[a-z-]+|i[0-8])( (hl-preview-[a-z-]+|alert-(?:title|icon)|poetry-[a-z-]+|i[0-8]))*$

[markup.sanitizer.markdown.previewPre]
ELEMENT = pre
ALLOW_ATTR = class
REGEXP = ^hl-preview-(fence|dependent)$

[markup.sanitizer.markdown.previewCode]
ELEMENT = code
ALLOW_ATTR = class
REGEXP = ^(hl-preview-fence|language-[A-Za-z0-9_-]+)$

[markup.sanitizer.markdown.previewAside]
ELEMENT = aside
ALLOW_ATTR = class
REGEXP = ^hl-preview-infobox$

[markup.sanitizer.markdown.alertSvgFill]
ELEMENT = svg
ALLOW_ATTR = fill
REGEXP = ^currentColor$

[markup.sanitizer.markdown.alertCircleX]
ELEMENT = circle
ALLOW_ATTR = cx
REGEXP = ^[0-9.]+$

[markup.sanitizer.markdown.alertCircleY]
ELEMENT = circle
ALLOW_ATTR = cy
REGEXP = ^[0-9.]+$

[markup.sanitizer.markdown.alertCircleRadius]
ELEMENT = circle
ALLOW_ATTR = r
REGEXP = ^[0-9.]+$

[markup.sanitizer.markdown.previewMain]
ELEMENT = main
ALLOW_ATTR = class
REGEXP = ^hl-preview-main$

[markup.sanitizer.markdown.alertBox]
ELEMENT = blockquote
ALLOW_ATTR = class
REGEXP = ^alert alert-(note|tip|important|warning)$

[markup.sanitizer.markdown.previewParagraph]
ELEMENT = p
ALLOW_ATTR = class
REGEXP = ^(alert-title|content-figure-label)$

[markup.sanitizer.markdown.alertSvgClass]
ELEMENT = svg
ALLOW_ATTR = class
REGEXP = ^alert-icon$

[markup.sanitizer.markdown.previewDetails]
ELEMENT = details
ALLOW_ATTR = class
REGEXP = ^secret$

[markup.sanitizer.markdown.footnoteSection]
ELEMENT = section
ALLOW_ATTR = class
REGEXP = ^footnotes$

[markup.sanitizer.markdown.footnoteSeparator]
ELEMENT = hr
ALLOW_ATTR = class
REGEXP = ^footnotes-sep$

[markup.sanitizer.markdown.footnoteList]
ELEMENT = ol
ALLOW_ATTR = class
REGEXP = ^footnotes-list$

[markup.sanitizer.markdown.footnoteItem]
ELEMENT = li
ALLOW_ATTR = class
REGEXP = ^footnote-item$

[markup.sanitizer.markdown.footnoteLink]
ELEMENT = a
ALLOW_ATTR = class
REGEXP = ^footnote-(ref|backref)$

[markup.sanitizer.markdown.footnoteRef]
ELEMENT = sup
ALLOW_ATTR = class
REGEXP = ^footnote-ref$

[markup.sanitizer.markdown.tableHeaderAlign]
ELEMENT = th
ALLOW_ATTR = class
REGEXP = ^hl-preview-align-(left|center|right)$

[markup.sanitizer.markdown.tableCellAlign]
ELEMENT = td
ALLOW_ATTR = class
REGEXP = ^hl-preview-align-(left|center|right)$

[markup.sanitizer.markdown.dictionaryList]
ELEMENT = dl
ALLOW_ATTR = class
REGEXP = ^dictionary$

[markup.sanitizer.markdown.secretFocus]
ELEMENT = span
ALLOW_ATTR = tabindex
REGEXP = ^0$
