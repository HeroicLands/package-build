name: Consumer proof

on:
    workflow_dispatch:
        inputs:
            candidate_sha:
                description: Exact package-build commit to verify
                required: true
                type: string

            consumer_sha:
                description: Exact Thalorna source commit for population, facial-hair or released-artwork proof
                required: false
                type: string

            art_release_tag:
                description: Published HeroicLands/art-thalorna release tag for thalorna-art-release
                required: false
                type: string

            art_release_sha256:
                description: Expected complete release digest from the reviewed native GitHub metadata
                required: false
                type: string

            population_addresses:
                description: JSON list of canonical Addresses for the population proof
                required: false
                type: string

            art_archives:
                description: Also compile with isolated artwork archive fixtures
                required: false
                default: false
                type: boolean

            consumer:
                description: Pinned consumer and assertions to run
                required: true
                type: choice
                default: kethira
                options:
                    - kethira
                    - thalorna-encoding
                    - thalorna-headwords
                    - authoring-reference
                    - thalorna-populations
                    - thalorna-facial-hair
                    - thalorna-art-release

permissions:
    contents: read

jobs:
    consumer:
        name: Kethira consumer compile
        if: ${{ github.event.inputs.consumer == 'kethira' }}
        runs-on: ubuntu-vm
        timeout-minutes: 60
        container:
            image: git.pupluppy.org/heroiclands/ci-job@sha256:e07e93044b9bd0c49ff8dc51fc9f21772bf1d42e889b211663f3a51514ab85e5
            options: --memory=2g --memory-swap=2g
        env:
            CONSUMER_PROOF: kethira
            CONSUMER_SHA: fc95936a8a89449e5785835311c85428743f74f4
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  github-server-url: https://git.pupluppy.org
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
                  cache: npm
            - name: Check the consumer lock guard
              run: node --test ci/consumer-lock-guard.test.mjs
            - name: Pack the candidate
              env:
                  CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
              run: bash ci/consumer-proof-pack.sh
            - name: Check out the consumer
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  github-server-url: https://git.pupluppy.org
                  persist-credentials: false
                  repository: HeroicLands/sohl-kethira-basic
                  ref: ${{ env.CONSUMER_SHA }}
                  path: consumer-proof-consumer
            - name: Compile the consumer with the candidate
              run: bash ci/consumer-proof.sh
            - name: Prove cold and cached artwork in Kethira
              if: ${{ github.event.inputs.art_archives == 'true' }}
              env:
                  CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
              run: node ci/consumer-art-proof.mjs

    thalorna:
        name: Thalorna consumer compile
        if: ${{ github.event.inputs.consumer == 'thalorna-encoding' || github.event.inputs.consumer == 'thalorna-headwords' }}
        runs-on: build
        timeout-minutes: 60
        env:
            CONSUMER_PROOF: ${{ github.event.inputs.consumer }}
            CONSUMER_SHA: 5050dea584f11552ec71c3b35d31a2739e9683eb
            NODE_OPTIONS: --max-old-space-size=3072
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  github-server-url: https://git.pupluppy.org
                  persist-credentials: false
            - name: Verify the full compile memory profile
              run: bash ci/consumer-proof-memory.sh before
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
                  cache: npm
            - name: Pack the candidate
              env:
                  CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
              run: bash ci/consumer-proof-pack.sh
            - name: Check out the consumer
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  github-server-url: https://git.pupluppy.org
                  persist-credentials: false
                  repository: HeroicLands/thalorna
                  ref: ${{ env.CONSUMER_SHA }}
                  path: consumer-proof-consumer
            - name: Compile the consumer with the candidate
              run: bash ci/consumer-proof.sh
            - name: Record full compile memory counters
              if: ${{ always() }}
              run: bash ci/consumer-proof-memory.sh after
            - name: Retain full compile memory evidence
              if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: consumer-proof-memory
                  path: ${{ runner.temp }}/consumer-proof-memory/
                  if-no-files-found: error
                  retention-days: 3

    art-release:
        name: Real artwork release in Thalorna
        if: ${{ github.event.inputs.consumer == 'thalorna-art-release' }}
        runs-on: build
        timeout-minutes: 180
        env:
            CONSUMER_PROOF: thalorna-art-release
            CONSUMER_SHA: ${{ github.event.inputs.consumer_sha }}
            CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
            ART_RELEASE_TAG: ${{ github.event.inputs.art_release_tag }}
            ART_RELEASE_SHA256: ${{ github.event.inputs.art_release_sha256 }}
            TMPDIR: ${{ runner.temp }}
            NODE_OPTIONS: --max-old-space-size=3072
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  github-server-url: https://git.pupluppy.org
                  persist-credentials: false
            - name: Verify the full compile memory profile
              run: bash ci/consumer-proof-memory.sh before
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
            - name: Verify Python ZIP inventory support
              run: python3 -c 'import sys,zipfile; assert sys.version_info >= (3, 8)'
            - name: Pack the exact candidate
              run: bash ci/consumer-proof-pack.sh
            - name: Check release proof and install guards
              run: |
                  node --test ci/consumer-lock-guard.test.mjs
                  npm test -- tests/consumer-art-release-proof.test.ts
            - name: Check out the exact Thalorna source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  github-server-url: https://git.pupluppy.org
                  persist-credentials: false
                  repository: HeroicLands/thalorna
                  ref: ${{ env.CONSUMER_SHA }}
                  path: consumer-proof-consumer
            - name: Prove the real release with cold and warm caches
              run: bash ci/consumer-proof.sh
            - name: Record full compile memory counters
              if: ${{ always() }}
              run: bash ci/consumer-proof-memory.sh after
            - name: Retain release proof receipt
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: art-release-consumer-proof
                  path: ${{ runner.temp }}/consumer-proof/art-release-evidence/
                  if-no-files-found: error
                  retention-days: 3
            - name: Retain full compile memory evidence
              if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: art-release-consumer-memory
                  path: ${{ runner.temp }}/consumer-proof-memory/
                  if-no-files-found: error
                  retention-days: 3

    populations:
        name: Thalorna population consumer proof
        if: ${{ github.event.inputs.consumer == 'thalorna-populations' }}
        runs-on: build
        timeout-minutes: 90
        env:
            CONSUMER_PROOF: thalorna-populations
            CONSUMER_SHA: ${{ github.event.inputs.consumer_sha }}
            CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
            POPULATION_PROOF_ADDRESSES: ${{ github.event.inputs.population_addresses }}
            TMPDIR: ${{ runner.temp }}
            NODE_OPTIONS: --max-old-space-size=3072
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  github-server-url: https://git.pupluppy.org
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
            - name: Pack the exact candidate
              run: bash ci/consumer-proof-pack.sh
            - name: Verify the population contract
              run: >-
                  npm test --
                  tests/population-values.test.ts
                  tests/polity-settlements-contract.test.ts
                  tests/populations.test.ts
                  tests/settlement-tables.test.ts
                  tests/settlement-inputs.test.ts
                  tests/settlement-selection.test.ts
                  tests/settlement-authoring.test.ts
                  tests/metadata-index.test.ts
                  tests/population-publication.test.ts
                  tests/population-journals.test.ts
                  tests/population-delivery-packs.test.ts
                  tests/base-compiler.test.ts
                  tests/art-alternatives.test.ts
                  tests/content-index-prepared-publication.test.ts
                  tests/content-session.test.ts
                  tests/culture-resolution.test.ts
                  tests/event-field-references.test.ts
                  tests/figure-references.test.ts
                  tests/lexical-source-audiences.test.ts
                  tests/multi-pack-routing.test.ts
                  tests/pack-folder.test.ts
                  tests/pack-none.test.ts
                  tests/page-lists-compile.test.ts
                  tests/pass-ordering.test.ts
                  tests/pdf-build.test.ts
                  tests/consumer-proof-populations.test.ts
            - name: Check out the exact Thalorna source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  github-server-url: https://git.pupluppy.org
                  persist-credentials: false
                  repository: HeroicLands/thalorna
                  ref: ${{ env.CONSUMER_SHA }}
                  path: consumer-proof-consumer
            - name: Compile and verify population output
              run: bash ci/consumer-proof.sh
            - name: Retain proof receipt
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: population-consumer-proof
                  path: ${{ runner.temp }}/consumer-proof/population-evidence/
                  if-no-files-found: error
                  retention-days: 3

    reference:
        name: Authoring reference generation
        if: ${{ github.event.inputs.consumer == 'authoring-reference' }}
        runs-on: ubuntu-vm
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  github-server-url: https://git.pupluppy.org
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
            - name: Generate controlled reference documents
              env:
                  CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
                  test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
                  stage="$GITHUB_WORKSPACE/build/authoring-reference"
                  rm -rf "$stage"
                  mkdir -p "$stage/snapshot" "$stage/artifact/docs/reference" "$stage/artifact/docs/authoring" "$stage/tmp"
                  export TMPDIR="$stage/tmp"
                  export npm_config_cache="$TMPDIR/npm-cache"
                  git archive "$CANDIDATE_SHA" | tar -x -C "$stage/snapshot"
                  cd "$stage/snapshot"
                  npm ci --ignore-scripts
                  node ci/content-format-reference.mjs
                  cp docs/reference/note-types.md docs/reference/format-details.md "$stage/artifact/docs/reference/"
                  cp docs/authoring/links-and-markup.md "$stage/artifact/docs/authoring/"
                  cd "$stage/artifact"
                  printf 'source_sha %s\n' "$CANDIDATE_SHA" > receipt.txt
                  sha256sum docs/reference/note-types.md docs/reference/format-details.md docs/authoring/links-and-markup.md >> receipt.txt
            - name: Retain generated references
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: authoring-reference
                  path: build/authoring-reference/artifact/
                  if-no-files-found: error

    facial-hair:
        name: Thalorna facial-hair consumer proof
        if: ${{ github.event.inputs.consumer == 'thalorna-facial-hair' }}
        runs-on: build
        timeout-minutes: 90
        env:
            CONSUMER_PROOF: thalorna-facial-hair
            CONSUMER_SHA: ${{ github.event.inputs.consumer_sha }}
            CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
            TMPDIR: ${{ runner.temp }}
            NODE_OPTIONS: --max-old-space-size=3072
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  github-server-url: https://git.pupluppy.org
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
            - name: Check the consumer lock guard
              run: node --test ci/consumer-lock-guard.test.mjs
            - name: Pack the exact candidate
              run: bash ci/consumer-proof-pack.sh
            - name: Verify the facial-hair contract
              run: >-
                  npm test --
                  tests/appearance-profile.test.ts
                  tests/npc-generate.test.ts
                  tests/culture-parents.test.ts
                  tests/content-index.test.ts
                  tests/facial-hair-consumer-proof.test.ts
            - name: Check out the exact Thalorna source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  github-server-url: https://git.pupluppy.org
                  persist-credentials: false
                  repository: HeroicLands/thalorna
                  ref: ${{ env.CONSUMER_SHA }}
                  path: consumer-proof-consumer
            - name: Compile and verify facial-hair output
              run: bash ci/consumer-proof.sh
            - name: Retain proof receipt
              if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: facial-hair-consumer-proof
                  path: ${{ runner.temp }}/consumer-proof/facial-hair-evidence/
                  if-no-files-found: error
                  retention-days: 3
