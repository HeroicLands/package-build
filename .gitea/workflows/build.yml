name: Build and Test

# Build and test, on pull requests and on `main`. It is the check `package-build
# ci` and the `pre-push` hook replay.
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

# A second push to the same branch supersedes the first; nothing here needs the
# older run to finish.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test-build:
        name: Build & Test
        # A throwaway Ubuntu container with root: the Typst step
        # installs into /usr/local/bin and GraphViz installs with apt-get, which
        # the host-mode runner's user cannot do.
        runs-on: ubuntu-vm
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Canonical git hooks
              uses: HeroicLands/.github/actions/githooks@028cfaa520b588cae334f046d3530947a499fae3
            # Wants a checkout and nothing else, so it runs before the install
            # and fails in seconds rather than after one. The rule — deferred
            # work is an issue, not a marker in a comment — and its
            # implementation live in the org-wide action; this repository
            # states only which files it applies to.
            #
            # `paths: .` rather than a list of directories: this package's
            # modules sit at its root as well as under `bin/`, `ci/`, `engine/`,
            # `hm3/` and `sohl/`, so a list would have to name sixteen root
            # files and would silently stop covering the seventeenth. A
            # checkout holds only tracked files, and the action prunes
            # `node_modules/`, so scanning the tree is both exact and
            # self-extending.
            - name: Check for forbidden markers
              uses: HeroicLands/.github/actions/todos@83bb0cd0af7db952098ef5fe2e8312e7f41040eb # main
              with:
                  paths: .

            # Wants a checkout and nothing else, like the step above, and for a
            # sharper reason: what it guards against breaks the *release*, which
            # no pull request check would otherwise see.
            #
            # A `node_modules` symlink to an absolute path defeats a
            # `.gitignore` of `/node_modules/`, whose trailing slash matches a
            # directory rather than a symlink. It breaks every release: the job
            # installs, and the changesets action's `git reset --hard` then
            # restores the symlink over the install, leaving every module
            # unresolvable — `changeset: not found`.
            #
            # This is the second lock, not the first. It is here because the
            # first one was also thought sufficient.
            - name: No dependency tree is tracked
              run: |
                  TRACKED="$(git ls-files | grep -E '(^|/)node_modules(/|$)' || true)"
                  if [ -n "$TRACKED" ]; then
                      echo "::error::A node_modules path is tracked. Installed dependencies must never be committed — a symlink here breaks every release. Run: git rm -r --cached <path>" >&2
                      printf '%s\n' "$TRACKED" >&2
                      exit 1
                  fi
                  echo "No node_modules path is tracked."
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Formatting
              run: npm run format:check
            # Separate steps name each check in the checks UI. `npm run lint`
            # runs the checks locally in parallel and aggregates their output.
            #
            # This repository *provides* `package-build markdown`, so it runs
            # it too.
            - name: Markdown
              run: npm run lint:markdown
            - name: Documentation links
              run: npm run lint:docs-links
            - name: Documentation links reject broken anchors
              run: |
                  set -eu
                  backup="$(mktemp)"
                  log="$(mktemp)"
                  cp docs/content-format.md "$backup"
                  trap 'cp "$backup" docs/content-format.md' EXIT
                  printf '\n[Lint probe](content-format.md#docs-link-lint-probe-missing)\n' >> docs/content-format.md
                  status=0
                  npm run lint >"$log" 2>&1 || status=$?
                  cat "$log"
                  if [ "$status" -eq 0 ]; then
                      echo "The lint chain accepted a broken documentation anchor." >&2
                      exit 1
                  fi
                  grep -F 'link content-format.md#docs-link-lint-probe-missing points at an anchor nobody declares' "$log"
                  cp "$backup" docs/content-format.md
                  trap - EXIT
                  npm run lint:docs-links
            # Every `system.*` target docs/content-format.md names, against a
            # published schema.json. Run against a committed fixture rather
            # than a real system's artifact: this package ships no system, and
            # a consuming system's schema carries its own tracked gaps —
            # pointing CI at one would fail this build for a reason that is not
            # this repository's. The fixture says so at the top of the file.
            - name: Content format
              run: npm run lint:content-format
            # A changeset answers one question — who notices, and what do they
            # see — and this is the check that holds a pending one to that
            # standard. It reads whatever `.changeset/*.md` files exist and
            # passes trivially when there are none: no pull request is
            # required to carry a changeset, only to write one that reads
            # well when it does.
            - name: Changeset quality
              run: node bin/package-build.mjs changelog check
            # The book tests compile a real PDF and assert on it — the outline,
            # the `/ToUnicode` map that makes it searchable. Without a compiler
            # they skip, and a criterion that skips is not a criterion. Pinned
            # and fetched with `run:` rather than a published action, so
            # `ci/ci-steps.mjs` can replay this step in the pre-push container
            # instead of reporting it as a gap.
            #
            # This and the two install steps below download Linux binaries or
            # call `apt-get`, so they install only on Linux. Anywhere else —
            # `package-build ci --native` on a Mac — they use the tool already
            # on `PATH` and fail, naming it, when there is none.
            - name: Typst, for the book tests
              run: |
                  set -euo pipefail
                  if [ "$(uname -s)" = Linux ]; then
                      ver=v0.15.1
                      url="https://github.com/typst/typst/releases/download/$ver/typst-x86_64-unknown-linux-musl.tar.xz"
                      curl -fsSL "$url" | tar -xJ --strip-components=1 -C /usr/local/bin \
                          typst-x86_64-unknown-linux-musl/typst
                  elif ! command -v typst >/dev/null 2>&1; then
                      echo "typst is not on PATH; install it to run the book tests off Linux." >&2
                      exit 1
                  fi
                  typst --version
            # The map tests render with GraphViz and assert on the SVG. The
            # runner image ships it; the pre-push container does not, so the
            # step installs it where `dot` is absent rather than letting the
            # rendering cases skip there.
            - name: GraphViz, for the map tests
              run: |
                  set -euo pipefail
                  if ! command -v dot >/dev/null 2>&1; then
                      if [ "$(uname -s)" != Linux ]; then
                          echo "dot is not on PATH; install GraphViz to run the map tests off Linux." >&2
                          exit 1
                      elif command -v sudo >/dev/null 2>&1; then
                          sudo apt-get update -q && sudo apt-get install -y -q graphviz
                      else
                          apt-get update -q && apt-get install -y -q graphviz
                      fi
                  fi
                  dot -V
            - name: Tests
              run: npm test
            # Declaration emit is what `prepack` runs at publish time, so a
            # failure here would otherwise only surface during a release.
            - name: Declaration emit
              run: npm run build:types
            - name: Published declaration check
              run: node bin/package-build.mjs types check --project tsconfig.dts.json --exports
